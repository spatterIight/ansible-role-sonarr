---
# What this scenario has to survive, established by running
# `lscr.io/linuxserver/sonarr` by hand before any of it was written:
#
# - Sonarr's web UI is a single-page application that answers 200 on every
#   path, `/zzz-does-not-exist` included, so "GET / returned 200" proves only
#   that some HTTP server is listening.
# - Corrupting `/config/sonarr.db` makes Sonarr abort with "Non-recoverable
#   failure, waiting for user intervention" while s6 keeps PID 1 alive: the
#   container stays `running`, its restart counter stays at 0, and
#   `systemctl is-active sonarr.service` still says `active`. The unit's state
#   is therefore worth almost nothing on its own.
# - `/ping` is the cheapest endpoint that opens the SQLite database: it reads
#   the whole Config table through Sonarr's configuration repository and
#   answers 500 `{"status": "Error"}` if that throws. It is what this scenario
#   waits on.
# - `/api/v3/system/status` needs the API key that Sonarr generates into
#   `/config/config.xml`, so reading the key out of the role's own data path
#   and having Sonarr accept it also proves that the bind-mount the role set up
#   is the directory the application is really using.
- name: Verify Sonarr
  hosts: all
  become: true
  gather_facts: false

  vars:
    # `sonarr_data_path` is derived through Jinja from `sonarr_base_path` and
    # `sonarr_identifier`, which this playbook cannot resolve because the role
    # is not in scope here. Spelling out the value the role's defaults produce
    # is safe: every assertion below would fail if the role stopped putting its
    # data there.
    sonarr_molecule_data_path: /sonarr/data

    sonarr_verify_units:
      - sonarr.service

  tasks:
    - name: Verify that Sonarr works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: sonarr_defaults

        - name: Wait for the Sonarr systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: sonarr_services
          until: sonarr_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ sonarr_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Sonarr systemd services are active
          ansible.builtin.assert:
            that: sonarr_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(sonarr_verify_units | zip(sonarr_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Sonarr systemd services log for debugging
          when: sonarr_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ sonarr_verify_units }}"

        # The published port is `sonarr_container_http_port` on both sides, so an
        # application that ignored the role's port setting and stayed on the 8989
        # the image exposes would leave this port answering nothing at all.
        - name: Wait for Sonarr to answer on the port the role configured
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ sonarr_container_http_port }}/ping"
            method: GET
            follow_redirects: none
            status_code: [200]
          register: sonarr_ping
          until: sonarr_ping.status == 200
          retries: 60
          delay: 5
          failed_when: false

        - name: Assert Sonarr answered /ping from its database
          ansible.builtin.assert:
            that:
              - sonarr_ping.status == 200
              - sonarr_ping.json.status | default('') == 'OK'
            fail_msg: >-
              Sonarr did not answer /ping with a database-backed OK on port
              {{ sonarr_container_http_port }}
              (status {{ sonarr_ping.status | default('none') }},
              body {{ sonarr_ping.json | default('none') }})
            success_msg: "Sonarr answered /ping with status OK on port {{ sonarr_container_http_port }}"

        - name: Read the configuration file Sonarr wrote into the role's data path
          ansible.builtin.slurp:
            src: "{{ sonarr_molecule_data_path }}/config.xml"
          register: sonarr_config_xml

        - name: Stat the configuration file Sonarr wrote into the role's data path
          ansible.builtin.stat:
            path: "{{ sonarr_molecule_data_path }}/config.xml"
          register: sonarr_config_stat

        # linuxserver.io images run s6 as root and drop to PUID/PGID. Four roles in
        # this fleet have shipped a uid override that left a directory the image
        # needed unwritable, so the scenario runs as a uid that is neither root nor
        # the 1000 the image defaults to, and checks who ends up owning the files.
        - name: Assert Sonarr wrote its configuration as the uid and gid the role was given
          ansible.builtin.assert:
            that:
              - sonarr_config_stat.stat.exists
              - sonarr_config_stat.stat.uid | int == sonarr_uid | int
              - sonarr_config_stat.stat.gid | int == sonarr_gid | int
            fail_msg: >-
              {{ sonarr_molecule_data_path }}/config.xml is owned by
              {{ sonarr_config_stat.stat.uid | default('none') }}:{{ sonarr_config_stat.stat.gid | default('none') }},
              not by {{ sonarr_uid }}:{{ sonarr_gid }}
            success_msg: "Sonarr wrote {{ sonarr_molecule_data_path }}/config.xml as {{ sonarr_uid }}:{{ sonarr_gid }}"

        - name: Extract the API key Sonarr generated
          ansible.builtin.set_fact:
            sonarr_api_key: >-
              {{ sonarr_config_xml.content | b64decode | regex_search('<ApiKey>([0-9a-fA-F]+)</ApiKey>', '\1') | first }}

        - name: Query the version of the running Sonarr
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ sonarr_container_http_port }}/api/v3/system/status"
            method: GET
            follow_redirects: none
            headers:
              X-Api-Key: "{{ sonarr_api_key }}"
            status_code: [200]
          register: sonarr_status

        # Sonarr's own versions have four components (4.0.19.2979) while the
        # linuxserver.io tag the role pins has three (4.0.19), so the pinned value
        # is matched as a prefix - with a trailing dot, so that 4.0.1 could never
        # be satisfied by a running 4.0.19.
        - name: Assert the running Sonarr is the version this role installs
          ansible.builtin.assert:
            that:
              - >-
                sonarr_status.json.version == sonarr_defaults.sonarr_version
                or sonarr_status.json.version.startswith(sonarr_defaults.sonarr_version ~ '.')
              - >-
                sonarr_status.json.packageVersion == sonarr_defaults.sonarr_version
                or sonarr_status.json.packageVersion.startswith(sonarr_defaults.sonarr_version ~ '.')
              - sonarr_status.json.isDocker
              - sonarr_status.json.appData == '/config'
            fail_msg: "Sonarr reports {{ sonarr_status.json.version | default('none') }}, expected {{ sonarr_defaults.sonarr_version }}"
            success_msg: "Sonarr reports {{ sonarr_status.json.version }}"

        - name: Read the timezone offset inside the Sonarr container
          ansible.builtin.command:
            cmd: "docker exec {{ sonarr_defaults.sonarr_identifier }} date +%z"
          register: sonarr_container_timezone
          changed_when: false

        - name: Assert the container runs in the timezone the role configured
          ansible.builtin.assert:
            that: sonarr_container_timezone.stdout | trim == sonarr_molecule_expected_timezone_offset
            fail_msg: >-
              The container reports UTC offset {{ sonarr_container_timezone.stdout | trim }}, not the
              {{ sonarr_molecule_expected_timezone_offset }} that sonarr_timezone={{ sonarr_timezone }} calls for
            success_msg: "The container runs at UTC offset {{ sonarr_molecule_expected_timezone_offset }}, as sonarr_timezone asks"

        - name: Inspect the Sonarr container
          ansible.builtin.command:
            cmd: docker container inspect sonarr
          register: sonarr_container_raw
          changed_when: false

        - name: Keep the parts of the container definition worth asserting on
          ansible.builtin.set_fact:
            sonarr_container: "{{ (sonarr_container_raw.stdout | from_json) | first }}"

        - name: Assert the role's environment reached the container
          ansible.builtin.assert:
            that:
              - "('PUID=' ~ sonarr_uid) in sonarr_container.Config.Env"
              - "('PGID=' ~ sonarr_gid) in sonarr_container.Config.Env"
              - "('TZ=' ~ sonarr_timezone) in sonarr_container.Config.Env"
              - "('SONARR__SERVER__PORT=' ~ sonarr_container_http_port) in sonarr_container.Config.Env"
              - "'SONARR_MOLECULE_MARKER=rendered-by-the-role' in sonarr_container.Config.Env"
            fail_msg: "The container environment is not what templates/env.j2 should have produced: {{ sonarr_container.Config.Env }}"
            success_msg: "The container environment is the one templates/env.j2 produced"

        # Four roles in this fleet accepted `*_container_additional_volumes` and
        # then dropped it on the floor, so this checks both that the entry became a
        # real `--mount` with its `readonly` option honoured, and that the mount
        # actually carries data through.
        - name: Assert the additional volume became a real read-only mount
          ansible.builtin.assert:
            that:
              - sonarr_container.Mounts | selectattr('Destination', 'equalto', '/config') | list | length == 1
              - (sonarr_container.Mounts | selectattr('Destination', 'equalto', '/config') | first).Source == sonarr_molecule_data_path
              - sonarr_container.Mounts | selectattr('Destination', 'equalto', sonarr_molecule_extra_volume_container_path) | list | length == 1
              - >-
                (sonarr_container.Mounts | selectattr('Destination', 'equalto', sonarr_molecule_extra_volume_container_path) | first).Source
                == sonarr_molecule_extra_volume_host_path
              - not (sonarr_container.Mounts | selectattr('Destination', 'equalto', sonarr_molecule_extra_volume_container_path) | first).RW
            fail_msg: "sonarr_container_additional_volumes did not turn into the expected mounts: {{ sonarr_container.Mounts }}"
            success_msg: "sonarr_container_additional_volumes turned into a read-only bind mount"

        - name: Read the marker through the additional volume
          ansible.builtin.command:
            cmd: >-
              docker exec {{ sonarr_defaults.sonarr_identifier }}
              cat {{ sonarr_molecule_extra_volume_container_path }}/marker
          register: sonarr_extra_volume_marker
          changed_when: false

        - name: Assert the additional volume carries data into the container
          ansible.builtin.assert:
            that: sonarr_extra_volume_marker.stdout | trim == sonarr_molecule_extra_volume_marker
            fail_msg: "The additional volume did not carry the marker into the container"
            success_msg: "The additional volume carries the marker into the container"

        - name: Assert the container joined both its own network and the additional one
          ansible.builtin.assert:
            that:
              - sonarr_defaults.sonarr_identifier in sonarr_container.NetworkSettings.Networks
              - sonarr_molecule_extra_network in sonarr_container.NetworkSettings.Networks
            fail_msg: >-
              The container is on {{ sonarr_container.NetworkSettings.Networks.keys() | list }},
              which is not the base network plus {{ sonarr_molecule_extra_network }}
            success_msg: "The container is on its own network and on {{ sonarr_molecule_extra_network }}"

        # The Traefik router rule, the strip-prefix middleware and the load
        # balancer port are all derived from role variables, so a label file that
        # stopped tracking them (or a load balancer pointed at the image's 8989
        # while the application listens on 8181) shows up here.
        - name: Assert the Traefik labels describe what the role deployed
          ansible.builtin.assert:
            that:
              - sonarr_container.Config.Labels['traefik.enable'] == 'true'
              - sonarr_container.Config.Labels['traefik.docker.network'] == sonarr_defaults.sonarr_identifier
              - "sonarr_container.Config.Labels['traefik.http.routers.sonarr.rule'] == 'Host(`sonarr.example.com`) && PathPrefix(`/sonarr`)'"
              - sonarr_container.Config.Labels['traefik.http.routers.sonarr.middlewares'] == 'sonarr-slashless-redirect,sonarr-strip-prefix'
              - sonarr_container.Config.Labels['traefik.http.middlewares.sonarr-strip-prefix.stripprefix.prefixes'] == '/sonarr'
              - sonarr_container.Config.Labels['traefik.http.routers.sonarr.entrypoints'] == 'web-secure'
              - sonarr_container.Config.Labels['traefik.http.routers.sonarr.tls'] == 'true'
              - sonarr_container.Config.Labels['traefik.http.services.sonarr.loadbalancer.server.port'] == sonarr_container_http_port | string
            fail_msg: "The Traefik labels are not what templates/labels.j2 should have produced: {{ sonarr_container.Config.Labels }}"
            success_msg: "The Traefik labels describe the hostname, path prefix and port the role was given"

        - name: Assert the free-form label and extra argument reached the container
          ansible.builtin.assert:
            that:
              - sonarr_container.Config.Labels['mash.molecule.additional_label'] == 'present'
              - sonarr_container.Config.Labels['mash.molecule.extra_argument'] == 'present'
            fail_msg: "sonarr_container_labels_additional_labels or sonarr_container_extra_arguments went nowhere"
            success_msg: "sonarr_container_labels_additional_labels and sonarr_container_extra_arguments reached the container"

        # Roles elsewhere in this fleet have emitted Traefik labels from outside
        # their `*_labels_traefik_enabled` conditional, which nobody notices until
        # a Traefik instance starts routing to a container that opted out. The
        # label file is rendered a second time here with Traefik switched off, so
        # that a leak out of the conditional fails the suite rather than the
        # operator's reverse proxy.
        - name: Render the label file with Traefik disabled
          ansible.builtin.template:
            src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/templates/labels.j2"
            dest: /tmp/sonarr-labels-with-traefik-disabled
            mode: "0644"
          vars:
            sonarr_container_labels_traefik_enabled: false
          changed_when: false

        - name: Read the label file rendered with Traefik disabled
          ansible.builtin.slurp:
            src: /tmp/sonarr-labels-with-traefik-disabled
          register: sonarr_labels_with_traefik_disabled

        - name: Assert nothing Traefik-related is emitted when Traefik is disabled
          ansible.builtin.assert:
            that:
              # Proves the render happened at all, rather than producing an empty
              # file that would satisfy the check below for the wrong reason.
              - "'mash.molecule.additional_label=present' in (sonarr_labels_with_traefik_disabled.content | b64decode)"
              - "'traefik' not in (sonarr_labels_with_traefik_disabled.content | b64decode)"
            fail_msg: >-
              templates/labels.j2 emits Traefik labels even with
              sonarr_container_labels_traefik_enabled set to false
            success_msg: "templates/labels.j2 emits no Traefik labels when Traefik is disabled"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "sonarr_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: sonarr_restarts_before
              loop: "{{ sonarr_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: sonarr_restarts_after
              loop: "{{ sonarr_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - sonarr_restarts_after.results | map(attribute='status.NRestarts') | list == sonarr_restarts_before.results | map(attribute='status.NRestarts') | list
                  - sonarr_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in sonarr_verify_units | zip(sonarr_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in sonarr_verify_units | zip(sonarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in sonarr_verify_units | zip(sonarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Sonarr verification summary
          ansible.builtin.debug:
            msg:
              - "Sonarr systemd: {% for unit, state in sonarr_verify_units | zip(sonarr_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Sonarr restarts: {% for unit, restarts in sonarr_verify_units | zip(sonarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Sonarr version: {{ sonarr_status.json.version }} (package {{ sonarr_status.json.packageVersion }})"
              - "Sonarr /ping on port {{ sonarr_container_http_port }}: {{ sonarr_ping.json.status }}"
              - "Sonarr container timezone offset: {{ sonarr_container_timezone.stdout | trim }}"
              - "Sonarr networks: {{ sonarr_container.NetworkSettings.Networks.keys() | list | join(', ') }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Sonarr systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=sonarr.service
          register: sonarr_service_log
          changed_when: false

        - name: Show the Sonarr systemd service log
          ansible.builtin.debug:
            var: sonarr_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Sonarr verification failed. The systemd service log is printed above."
