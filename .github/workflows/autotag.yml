---
name: Autotag releases

on:  # yamllint disable-line rule:truthy
  push:
    # `develop` is this repository's default branch, so it is where Renovate
    # opens its updates and where its branch automerges land. `main` is listed
    # as well because it is where every tag this repository has ever cut sits,
    # and work reaches it later as a merge of `develop`.
    #
    # Listing both is safe: the tag is derived from the state of the role
    # rather than from the commits that produced it, so whichever branch
    # reaches a given state first cuts the tag and the other one finds nothing
    # left to release.
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write  # required to push tags

jobs:
  autotag:
    name: Autotag
    runs-on: ubuntu-latest

    # Releases are cut in the repository this role is published from, and there
    # only. A fork sees its own, incomplete set of tags, so it would compute a
    # release number that is already taken upstream and attach it to different
    # code. The `mother-of-all-self-hosting` fork, through which contributions
    # to this role are staged, is exactly that case.
    if: ${{ !github.event.repository.fork }}

    # Tag numbers are derived from the tags that already exist, so two commits
    # landing close together must not be looked at simultaneously - they would
    # both compute the same number. Runs are queued rather than cancelled, so
    # that every commit deserving a release still gets one.
    concurrency:
      group: autotag
      cancel-in-progress: false

    steps:
      # The full history and all tags, since we compare against the previous release.
      - name: Check out
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Determine the next tag
        id: tag
        run: |
          tag="$(bin/compute-next-tag.sh)"
          if [ -z "$tag" ]; then
            echo 'No release is needed for this commit'
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
